<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <title>Surprise for Preeti 🎉</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      animation: fadeIn 2s ease-in;
      font-family: 'Great Vibes', cursive;
      background-image: url('photoes/background_image1.png'); /* relative path */
      background-size: cover;       /* scales image to cover entire screen */
      background-position: center;  /* centers the image */
      background-repeat: no-repeat;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: all 1s ease;
    }

    h1 {
      font-size: 3rem;
      color: #c2185b;
      text-align: center;
      margin-bottom: 30px;
      animation: popIn 1.5s ease-out forwards;
      text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.6);
    }

    .countdown {
      font-size: 1.5rem;
      color: #6a1b9a;
      margin-bottom: 20px;
      animation: fadeIn 2s ease;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.5rem;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: transform 0.3s, background 0.3s;
      animation: fadeIn 2s ease forwards;
      font-family: 'Great Vibes', cursive;
    }

    .btn:hover {
      background: #f50057;
      transform: scale(1.05);
    }

    .btn:disabled {
      background: #b88b8b;
      cursor: not-allowed;
    }

    h1,
    .countdown,
    .btn {
      position: relative;
      z-index: 2;
    }

    @keyframes popIn {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 60px;
      background: radial-gradient(circle, #ff8a65, #d84315);
      border-radius: 50% 50% 50% 50%;
      animation: floatUp 10s linear infinite;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: #333;
      transform: translateX(-50%);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: hsl(calc(var(--hue) * 1deg), 100%, 60%);
      animation: confettiFall 5s linear infinite;
      opacity: 0.8;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-10px) rotate(0);
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    .fade-out {
      opacity: 0;
      transform: scale(1.05);
      transition: all 1.6s ease;
    }

    .curtain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .curtain.show {
      z-index: 9999;
    }

    .curtain-panel {
      position: absolute;
      opacity: 0;
      visibility: hidden;
      transition: transform 1.8s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.4s ease, visibility 0s linear 0.4s;
      background: linear-gradient(180deg, #8a0f36 0%, #560029 48%, #22000d 100%);
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 3px, transparent 3px 18px),
        linear-gradient(0deg, rgba(255,255,255,0.08), transparent 18%),
        radial-gradient(circle at 24% 20%, rgba(255,255,255,0.12), transparent 9%),
        radial-gradient(circle at 76% 18%, rgba(255,255,255,0.08), transparent 11%);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.75), inset 0 18px 100px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .curtain-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.26), transparent 40%),
                  repeating-linear-gradient(90deg, rgba(255,255,255,0.1) 0 4px, transparent 4px 16px);
      opacity: 0.9;
      pointer-events: none;
    }

    .curtain-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16), transparent 18%),
                  radial-gradient(circle at 50% 100%, rgba(0,0,0,0.18), transparent 24%);
      opacity: 0.8;
      pointer-events: none;
    }

    .curtain-left::before,
    .curtain-right::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 0;
      right: 0;
      height: 80%;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 35%),
                  radial-gradient(circle at 20% 50%, rgba(0,0,0,0.08), transparent 18%),
                  radial-gradient(circle at 80% 50%, rgba(0,0,0,0.08), transparent 18%);
      opacity: 0.4;
      pointer-events: none;
    }

    .curtain-left,
    .curtain-right {
      top: 0;
      width: 45%;
      height: 100%;
    }

    .curtain-top,
    .curtain-bottom {
      left: 0;
      width: 100%;
      height: 18%;
      background: linear-gradient(180deg, rgba(196, 38, 90, 0.98), rgba(80, 18, 55, 0.96));
      box-shadow: inset 0 14px 55px rgba(0,0,0,0.55);
      clip-path: polygon(0 0, 10% 100%, 20% 0, 30% 100%, 40% 0, 50% 100%, 60% 0, 70% 100%, 80% 0, 90% 100%, 100% 0);
      z-index: 2;
    }

    .curtain-left {
      left: 0;
      transform: translateX(-110%);
      clip-path: polygon(0 0, 96% 10%, 96% 90%, 0 100%);
      box-shadow: inset 0 0 90px rgba(0,0,0,0.55), inset 12px 0 48px rgba(0,0,0,0.3);
    }

    .curtain-right {
      right: 0;
      transform: translateX(110%);
      clip-path: polygon(4% 10%, 100% 0, 100% 100%, 4% 90%);
      box-shadow: inset 0 0 90px rgba(0,0,0,0.55), inset -12px 0 48px rgba(0,0,0,0.3);
    }

    .curtain-top {
      top: 0;
      transform: translateY(-110%);
    }

    .curtain-bottom {
      bottom: 0;
      transform: translateY(110%);
    }

    .curtain.show .curtain-left {
      transform: translateX(0);
    }

    .curtain.show .curtain-panel {
      opacity: 1;
      visibility: visible;
    }

    .curtain.show .curtain-left {
      transform: translateX(0);
    }

    .curtain.show .curtain-right {
      transform: translateX(0);
    }

    .curtain.show .curtain-top {
      transform: translateY(0);
    }

    .curtain.show .curtain-bottom {
      transform: translateY(0);
    }

  </style>
</head>
<body>

  <h1>Preeti are you excited for a beautiful surprise? 🎁</h1>
  <div class="countdown" id="countdown">Revealing in 10...</div>
  <button class="btn" id="surpriseBtn" onclick="startTransition()" disabled>Click here!</button>
  <div class="curtain" id="curtain">
    <div class="curtain-panel curtain-top"></div>
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <div class="curtain-panel curtain-bottom"></div>
  </div>

  <!-- Balloons -->
  <script>
    const curtain = document.getElementById('curtain');

    // 🎈 Balloons & Confetti
    for (let i = 0; i < 15; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = `${Math.random() * 100}%`;
      balloon.style.background = `radial-gradient(circle, hsl(${Math.random()*360}, 100%, 70%), hsl(${Math.random()*360}, 100%, 50%))`;
      balloon.style.animationDuration = `${6 + Math.random() * 5}s`;
      document.body.appendChild(balloon);
    }

    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = `${Math.random() * 100}%`;
      confetti.style.top = `${Math.random() * 100}vh`;
      confetti.style.setProperty('--hue', Math.floor(Math.random() * 360));
      confetti.style.animationDelay = `${Math.random() * 5}s`;
      confetti.style.animationDuration = `${3 + Math.random() * 2}s`;
      document.body.appendChild(confetti);
    }

    // ⏳ Countdown
    let countdown = 10;
    const countdownElement = document.getElementById('countdown');
    const button = document.getElementById('surpriseBtn');

    const timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        countdownElement.textContent = `Revealing in ${countdown}...`;
      } else {
        clearInterval(timer);
        countdownElement.textContent = "Ready to reveal!";
        button.disabled = false;
        button.textContent = 'Click here to open the surprise';
      }
    }, 1000);

    // 🎬 Transition to next page
    function startTransition() {
      button.disabled = true;
      button.textContent = 'Opening...';
      curtain.classList.add('show');
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'birthday.html'; // ⬅️ change if needed
      }, 1600);
    }
  </script>
</body>
</html>
